; TapeStopper control reference
; Stage 11.5
; This is an information file. Editing it does not change the plug-in.

[OVERVIEW]
Product=TapeStopper
Format=Windows x64 VST3 audio effect
Operation=Press the large blue button to run the DOWN transition. Release it, or press it again in Toggle mode, to run the UP transition.
MouseTiming=Use the left mouse button for the green DOWN marker and the right mouse button for the red UP marker.

[MAIN_PLAY_BUTTON]
Label=Large blue Play or Stop button
Purpose=Starts the DOWN transition and then starts the UP transition according to the selected Play mode.
Momentary=Press and hold to run DOWN. Release to run UP.
Toggle=Click once to run DOWN. Click again to run UP.
Display=The icon shows the current state unless BUTTON REVERSED is selected in Setup.

[RETRIG_BUTTON]
Label=RETRIG
Purpose=Jumps instantly to stopped speed as a pulse, then runs the current UP transition.
Operation=Click once. No hold or second click is required.
PlayMode=Works the same in PLAY M and PLAY T modes.
DownSettings=Does not use the DOWN enable, time, curves or global Envelope.
UpSettings=Uses the current UP enable, time and enabled UP curves for the recovery.
OtherSettings=Mute At and the tape-character controls remain active during the UP recovery.
MainPlay=If the main Play control is engaged, RETRIG releases it before starting its own cycle.
Interruption=Using the normal main Play control during RETRIG cancels the automatic cycle and returns control to normal Play operation.
Indicator=Highlights blue while the automatic cycle is active and returns to silver when finished.
Presets=RETRIG is a temporary action and is not stored in presets.
Automation=Change the Retrigger parameter from Off to On to fire once, then return it to Off to rearm it.

[UP_BUTTON]
Label=UP
Purpose=Enables or disables the gradual return to full speed.
Enabled=Releasing or toggling the main button runs the timed UP transition.
Disabled=The sound returns to full speed immediately instead of running the UP transition.
Indicator=Highlights red only while the UP transition is moving. It is silver while idle.

[DOWN_BUTTON]
Label=DOWN
Purpose=Enables or disables the gradual slowdown.
Enabled=Pressing or toggling the main button runs the timed DOWN transition.
Disabled=The sound changes to the stopped state immediately instead of running the DOWN transition.
Indicator=Highlights green only while the DOWN transition is moving. It is silver while idle.

[PLAY_MODE_BUTTON]
Labels=PLAY: M or PLAY: T
Purpose=Selects how the large blue button responds.
M=Momentary. DOWN begins on mouse-down and UP begins when the mouse button is released.
T=Toggle. One click begins DOWN and the next click begins UP.

[TIMING_MODE_BUTTON]
Labels=FREE or SYNC
Purpose=Switches both transition timers between seconds and host-tempo divisions.
FREE=Uses continuous times from 0.05 to 8.00 seconds.
SYNC=Uses musical divisions calculated from tempo information supplied by the host.
Memory=FREE and SYNC selections are retained separately when changing modes.

[TIMING_BAR]
Purpose=Sets independent DOWN and UP transition times and shows current transition position.
GreenMarker=DOWN time. Click or drag on the timing track with the left mouse button.
RedMarker=UP time. Click or drag on the timing track with the right mouse button.
BlueMarker=Read-only motion indicator. It moves right during DOWN and left during UP.
FreeDirection=Move a timing marker left for a longer transition or right for a shorter transition.
SyncBehaviour=Markers snap to the available musical divisions.
SyncDivisions=4 BAR, 2 BAR, 1 BAR, 1/2, 1/2T, 1/4, 1/4T, 1/8, 1/16, 1/16T, 1/32, 1/32T, 1/64
Readout=Shows both selected times or divisions below the track.
HitArea=Only the visible timing track is interactive. The text readout below it is not clickable.

[GRAPH_VIEW_TABS]
Labels=PITCH, FILTER, VOLUME and ENVELOPE
Location=Directly beneath the central graph.
Selection=Click a tab name to display and edit that view. Selection does not change its enabled state.
Enable=Click the small LED immediately left of a tab to enable or bypass that function.
Indicators=A bright LED means On; a dim LED means Off.
Colours=Pitch is blue, Filter is orange, Volume is purple and Envelope retains green.
DefaultView=Envelope.

[PITCH_CURVE]
Purpose=Controls tape speed and pitch independently during DOWN and UP.
Off=Bypasses the tape-speed change while the Filter and Volume curves can continue running.
Down=Square cyan points and curve; drag with the left mouse button.
Up=Circular blue points and curve; drag with the right mouse button.

[FILTER_CURVE]
Purpose=Controls a low-pass filter independently during DOWN and UP.
Off=Bypasses only curve-controlled filtering.
Down=Square orange points; drag with the left mouse button.
Up=Circular brown points and curve; drag with the right mouse button.

[VOLUME_CURVE]
Purpose=Controls processed-signal level independently during DOWN and UP.
Off=Bypasses only curve-controlled volume movement. Mute At and Full Speed Mute remain independent.
Down=Square violet points and curve; drag with the left mouse button.
Up=Circular indigo points and curve; drag with the right mouse button.

[SIMPLE_CURVE_EDITOR]
Views=Pitch, Filter and Volume.
HorizontalAxis=Transition position from full speed on the left to the stopped end on the right.
Points=Each DOWN and UP curve has five vertically draggable points equally spaced at approximately 16.7%, 33.3%, 50%, 66.7% and 83.3% horizontally.
Shape=Smooth interpolation through the five points supports gentle, steep, S-shaped and non-monotonic movement with finer control.
Direction=DOWN travels left-to-right. UP travels right-to-left.
ResetDown=Double-click the graph with the left mouse button to reset DOWN to Linear.
ResetUp=Double-click the graph with the right mouse button to reset UP to Linear.
Readout=While dragging, the display shows the direction, point number and percentage.

[GLOBAL_ENVELOPE]
Purpose=Retains TapeStopper's separate 11-point downward pitch/scratch modulation.
On=Adds its pitch offsets on top of the enabled Pitch curve during DOWN.
Off=The Envelope remains editable and visible but does not affect audio.
HorizontalAxis=Time through DOWN.
VerticalAxis=Pitch offset from +12 semitones at the top to -12 semitones at the bottom.
CentreLine=Zero additional pitch.
EndPoints=The first and last points move vertically only.
MiddlePoints=The middle nine points move horizontally and vertically but cannot cross adjacent points.
MovePoint=Click and drag a square point with the left mouse button.
ResetOnePoint=Double-click a point to return it to zero semitones without changing its time position.

[GRAPH_TRACE]
Purpose=The persistent red trace remains visible behind every selected graph view.
HorizontalAxis=Progress through the current DOWN or UP transition.
VerticalAxis=Effective tape speed from stopped at the bottom to full speed at the top.
Scope=The trace always represents tape speed and pitch. Filter cutoff and Volume level are represented by their coloured curves rather than the red trace.

[CONTEXT_RESET_BUTTON]
CurveLabel=CURVE RESET
CurveAction=In Pitch, Filter or Volume view, resets both the DOWN and UP curves to Linear.
EnvelopeLabel=ENV RESET
EnvelopeAction=In Envelope view, centres all eleven Envelope points while preserving their horizontal positions.

[FILTER_AMOUNT_KNOB]
Label=FLTR AMT: value%
Range=0% to 100%
Purpose=Sets how far the low-pass filter closes at maximum curve travel.
Neutral=0% produces no filtering even when the Filter curve is enabled.
Sweep=The selected DOWN or UP curve directly controls logarithmic cutoff movement toward 120 Hz.

[VOLUME_AMOUNT_KNOB]
Label=VOL AMT: value%
Range=0% to 100%
Purpose=Sets the maximum volume reduction reached by the Volume curve.
Neutral=0% produces no curve-controlled level change even when Volume is enabled.

[SEQUENCER_VIEW_BUTTON]
Label=SEQ
Location=Always visible at the lower-left of the bottom panel.
Purpose=Switches the bottom panel between the seven knobs and the 64-step sequencer editor.
DisplayOnly=Opening or closing the sequencer editor does not enable or disable sequencing.

[SEQUENCER_ENABLE_LED]
Location=Immediately right of the SEQ button.
Purpose=Enables or disables sequencer control of the main Play button.
On=Bright blue. The active pattern controls Play while the host transport runs.
Off=Dim blue. The normal manual Play controls operate without sequencer intervention.

[SEQUENCER_STEPS]
Count=64 steps arranged as two rows of 32.
OffStep=Leaves the main Play state released for that step.
OnStep=Holds the main Play state engaged for the complete step.
LongGate=Use adjacent On steps to create a longer uninterrupted trigger.
Edit=Click a square to toggle it. Click and drag to paint several squares On or Off.
Position=A bright outline shows the current step while the host is playing.
LengthDisplay=Steps outside the selected Length are dimmed and do not play.

[SEQUENCER_CLOCK]
Labels=SYNC or FREE
Layout=SYNC/FREE, RATE, LEN, OFF and RESET use matching button widths with clear spacing between them.
Change=Left-click advances and right-click reverses. Mouse wheel is also supported.
SYNC=Runs from host tempo and musical position.
FREE=Uses a tempo-independent millisecond duration but still starts and stops with host transport.

[SEQUENCER_RATE]
SyncValues=1/2, 1/4, 1/8, 1/8T, 1/16, 1/16T, 1/32, 1/32T, 1/64, 1/64T, 1/128
FreeValues=25, 50, 75, 100, 125, 150, 200, 250, 333, 500, 750, 1000, 1500 or 2000 ms per step.
Change=Left-click advances and right-click reverses. Mouse wheel is also supported.
EndBehaviour=Adjustment stops at the first or last Rate instead of wrapping.

[SEQUENCER_LENGTH]
Label=LEN value
Range=1 to 64 steps.
Purpose=Sets the repeating pattern length.
Change=Left-click increases, right-click decreases, or use the mouse wheel.
EndBehaviour=Adjustment stops at 1 or 64 instead of wrapping.

[SEQUENCER_OFFSET]
Label=OFF value
Range=0 to 63 steps.
Purpose=Moves the pattern start relative to the host clock.
Change=Left-click increases, right-click decreases, or use the mouse wheel.
EndBehaviour=Adjustment stops at 0 or 63 instead of wrapping.

[SEQUENCER_RESET]
Label=RESET
Purpose=Clears all 64 sequencer steps. Other sequencer settings remain unchanged.

[MUTE_AT_KNOB]
Label=MUTE AT: value%
Range=0% to 100%
Purpose=Mutes the output when transition travel reaches the selected threshold.
DownBehaviour=During DOWN, audio mutes when the blue position reaches or passes the threshold.
StoppedBehaviour=Audio remains muted in the stopped state.
UpBehaviour=During UP, audio becomes audible again after the blue position moves back below the threshold.
Display=The percentage label is informative only. Adjust the knob to change the value.

[DRIVE_KNOB]
Label=DRIVE: value%
Range=0% to 100%
Purpose=Adds smoothly adjustable tape-style saturation.
Neutral=0% adds no saturation.

[WOW_KNOB]
Label=WOW: value%
Range=0% to 100%
Purpose=Adds slow tape-speed variation at 0.33 Hz.
Neutral=0% adds no Wow modulation.

[FLUTTER_KNOB]
Label=FLUTTER: value%
Range=0% to 100%
Purpose=Adds faster tape-speed variation at 6.5 Hz.
Neutral=0% adds no Flutter modulation.

[FLUX_KNOB]
Label=FLUX: value%
Range=0% to 100%
Purpose=Adds irregular pitch warble and worn-tape playback errors during DOWN and UP.
Difference=Unlike periodic WOW and FLUTTER, FLUX changes at unpredictable intervals.
Motion=The instability becomes more apparent as playback moves farther from full speed.
EnvelopeOn=FLUX fluctuates relative to the pitch currently produced by the downward envelope.
EnvelopeOff=FLUX remains active and fluctuates relative to the normal tape slowdown or startup pitch.
Stereo=Both channels share the same instability so the stereo image does not wander.
Neutral=0% adds no Flux processing.

[MIX_KNOB]
Label=MIX: value%
Range=0% to 100%
Purpose=Blends the dry input with the processed output.
Dry=0% outputs the unprocessed input, except that the global mute behaviour still applies.
Wet=100% outputs the fully processed signal.

[PRESET_NAME_DISPLAY]
Default=INIT
Purpose=Shows the current preset name.
Style=Reads the exact unchanged light-grey background colour used by the preset navigation buttons.
MouseWheel=Scroll over the name to load presets one at a time.
Order=INIT followed by saved user presets in alphabetical order.

[PREVIOUS_PRESET_BUTTON]
Label=<
Purpose=Loads the previous preset. The list wraps at either end.
Style=Uses enlarged text for readability at the default GUI size.

[NEXT_PRESET_BUTTON]
Label=>
Purpose=Loads the next preset. The list wraps at either end.
Style=Uses enlarged text for readability at the default GUI size.

[NAME_BUTTON]
Label=NAME
Purpose=Renames the selected user preset.
Style=Uses enlarged text for readability at the default GUI size.
InitBehaviour=When INIT is selected, NAME opens a dialog to save the current settings as a new preset.
ReservedName=INIT cannot be used as a user preset name.

[MENU_BUTTON]
Label=MENU
Purpose=Opens the preset menu.
Style=Uses enlarged text for readability at the default GUI size.
Save=Overwrites the currently selected user preset. When INIT is selected, it asks for a new preset name.
SaveAs=Creates a new user preset after asking for a name.
Load=Opens a submenu containing INIT and all saved user presets.
Location=User presets are stored beside the VST3 in Data\Presets.

[SETUP_COG]
Label=Light-grey cog icon at the upper-right
Purpose=Shows or hides Setup in the centre section of the interface.
Display=Click once to show Setup and again to return to the timing bar and envelope.
Style=Uses the same colour as the TAPESTOPPER title; the visible cog artwork aligns with the right edge of the Envelope and Mute At panel.

[FULL_SPEED_MUTE]
Labels=FULL SPEED MUTE: ON or FULL SPEED MUTE: OFF
Location=Setup, Audio
Purpose=Mutes normal full-speed output for send-effect use while allowing the tape transitions to be heard.
Off=Normal full-speed audio passes through.
Storage=This global option is saved in Data\Settings.ini and is not stored in presets.
Automation=Full Speed Mute is exposed as a VST3 On/Off parameter for DAW automation.

[BUTTON_DISPLAY]
Labels=BUTTON: NORMAL or BUTTON: REVERSED
Location=Setup, Display
Width=Matches the Full Speed Mute button.
Purpose=Swaps the Play and Stop icons on the large blue button without changing audio or trigger behaviour.
Normal=Uses the standard current-state icon arrangement.
Reversed=Displays the opposite icon arrangement.
Storage=This global option is saved in Data\Settings.ini and is not stored in presets.

[WAVEFORM_DISPLAY]
Labels=WAVEFORM: ON or WAVEFORM: OFF
Location=Setup, Display
Width=Matches the Full Speed Mute button.
Purpose=Shows or hides a persistent red trace of the tape-speed transition behind the envelope graph.
HorizontalAxis=Progress through the current DOWN or UP transition.
VerticalAxis=Effective tape speed from stopped at the bottom to full speed at the top.
Detail=The trace is captured after Envelope and Flux pitch calculations so their movement is visible.
Persistence=The completed transition remains visible until another DOWN or UP movement begins.
On=Captures and displays the transition trace.
Off=Stops trace capture as well as hiding it, reducing display-related processing.
Storage=This global option is saved in Data\Settings.ini and is not stored in presets.

[WINDOW_RESIZE]
DefaultSize=800 x 300 pixels
Range=75% to 200%
MinimumSize=600 x 225 pixels
MaximumSize=1600 x 600 pixels
Operation=Drag the bottom-right corner of the plug-in window.
AspectRatio=The horizontal aspect ratio remains fixed while resizing.
Storage=The last size is restored from Data\Settings.ini when the editor opens again.

[PORTABLE_FILES]
Settings=Data\Settings.ini stores GUI scale, Full Speed Mute, Button Display and Waveform Display.
Presets=Data\Presets contains saved user preset INI files, including all sequencer settings and 64 step states.
Location=The Data folder is created beside the loaded TapeStopper.vst3 file.
[PLUGIN_IDENTITY]
Manufacturer=sl23
ManufacturerCode=sl23
PluginCode=TpSt
BundleID=com.sl23.tapestopper
Stability=These identifiers are permanent and must remain unchanged in future releases.
Compatibility=Hosts recognise this identity as a different plug-in from earlier builds that used provisional identifiers.
